[package]
name = "pakf"
description = "pakf shares project files through packs. Unstable: its commands, options and file formats can change in any release."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Elastic-2.0"
repository = "https://github.com/six5536/pakf"
readme = "README.md"
keywords = ["packs", "project-files", "templates", "merge", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE"]

[[bin]]
name = "pakf"
path = "src/main.rs"

[dependencies]
agent-harness-adapter-core = "0.5.0"
clap = { version = "4.6", features = ["derive"] }
pakf-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.2"
boon = "0.6"
dunce = "1.0"
toml = "1.1"

[lints]
workspace = true
